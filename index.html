<!DOCTYPE html>

  <!-- Main Card -->
  <div class="bg-white/80 backdrop-blur-md rounded-[40px] shadow-2xl max-w-xl w-full p-10 text-center border-4 border-white relative z-10">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img
        src="waysmarketing_logo.jfif"
        alt="WAYS Logo"
        class="w-56 drop-shadow-xl"
      />
    </div>

    <!-- Lemonade Emoji -->
    <div class="text-7xl mb-4 animate-bounce">🍹</div>

    <!-- Heading -->
    <h1 class="text-4xl font-extrabold text-yellow-500 mb-3 leading-tight">
      Hope You Enjoyed<br />Your Lemonade 🍋
    </h1>

    <p class="text-gray-700 text-lg mb-8 font-medium">
      Rate your lemonade experience below!
    </p>

    <!-- Rating Buttons -->
    <div id="rating" class="flex justify-center gap-3 mb-8 flex-wrap">
      <button class="text-5xl hover:scale-125 transition">🍹</button>
      <button class="text-5xl hover:scale-125 transition">🍹</button>
      <button class="text-5xl hover:scale-125 transition">🍹</button>
      <button class="text-5xl hover:scale-125 transition">🍹</button>
      <button class="text-5xl hover:scale-125 transition">🍹</button>
    </div>

    <!-- Thank You Message -->
    <div id="thankyou" class="hidden bg-yellow-100 rounded-3xl p-5 border-2 border-dashed border-yellow-400">
      <p class="text-yellow-700 font-bold text-lg">
        Thank you for rating us 💛
      </p>
    </div>

  </div>

  <!-- JAVASCRIPT GOES HERE -->
  <script>
    const buttons = document.querySelectorAll('#rating button');
    const thankyou = document.getElementById('thankyou');

    buttons.forEach((button, index) => {
      button.addEventListener('click', () => {
        thankyou.classList.remove('hidden');

        buttons.forEach((btn, i) => {
          if (i <= index) {
            btn.innerHTML = '🍋';
          }
        });
      });
    });
  </script>

</body>
</html>
