<body>

  <div class="lemon lemon1">🍋</div>
  <div class="lemon lemon2">🍋</div>
  <div class="lemon lemon3">🍋</div>
  <div class="lemon lemon4">🍋</div>

  <div class="container">

    <img src="waysmarketing_logo.jfif" alt="WAYS Logo" class="logo">

    <h1>
      Hope You Enjoyed<br>
      Your Lemonade 🍋
    </h1>

    <p>Rate your lemonade experience!</p>

    <div class="rating">
      <span class="drink">🍹</span>
      <span class="drink">🍹</span>
      <span class="drink">🍹</span>
      <span class="drink">🍹</span>
      <span class="drink">🍹</span>
    </div>

    <div class="thankyou" id="thankyouMessage">
      Thank you for rating us 💚
    </div>

  </div>

  <script>
    const drinks = document.querySelectorAll('.drink');
    const thankyou = document.getElementById('thankyouMessage');

    drinks.forEach((drink, index) => {
      drink.addEventListener('click', () => {
        thankyou.style.display = 'block';

        drinks.forEach((d, i) => {
          if(i <= index) {
            d.innerHTML = '🍋';
          }
        });
      });
    });
  </script>

</body>
